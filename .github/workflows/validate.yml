name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # "brands" only gates inclusion in the HACS *default* repository
          # list, which needs either brand assets here or a pull request to
          # home-assistant/brands. Installing this as a custom repository does
          # not require it. Drop this ignore if the integration is ever
          # submitted for default inclusion.
          ignore: brands
