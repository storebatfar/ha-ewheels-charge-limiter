name: Release

on:
  push:
    tags: ["v*"]

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(jq -r .version custom_components/ewheels_charge_limiter/manifest.json)
          echo "tag=$TAG manifest=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag $TAG does not match manifest version $MANIFEST."
            echo "::error::HACS shows the manifest version, so the two drifting apart"
            echo "::error::means users see a version that was never released."
            exit 1
          fi
