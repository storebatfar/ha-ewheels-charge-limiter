record_charge:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: ewheels_charge_limiter
    start_soc:
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    end_soc:
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    energy_wh:
      required: true
      selector:
        number:
          min: 0.1
          max: 20000
          step: 0.1
          unit_of_measurement: Wh
          mode: box
